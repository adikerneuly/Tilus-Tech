<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Tilus-Tech</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #2ea043; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Tableau de bord Tilus-Tech</h1>
    <button id="logoutBtn">Se déconnecter</button>
    <hr>
    <h2>Projets</h2>
    <div id="projectsList">Chargement...</div>

    <script>
        async function loadProjects() {
            const res = await fetch('/api/projects');
            const data = await res.json();
            const list = document.getElementById('projectsList');
            if(data.length === 0) {
                list.innerHTML = 'Aucun projet pour l\'instant.';
                return;
            }
            list.innerHTML = data.map(p => `<div class="card"><strong>${p.title}</strong><br>${p.description}</div>`).join('');
        }
        loadProjects();

        document.getElementById('logoutBtn').onclick = async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        };
    </script>
</body>
</html>
